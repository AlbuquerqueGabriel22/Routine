name: Build Routiner Android app

on:
  push:
    branches:
      - main
    tags:
      - android-v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Android project
        run: npm run android:sync

      - name: Build installable APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Prepare APK for download
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Routiner-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Routiner-Android-${{ github.sha }}
          path: release-assets/Routiner-Android.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Routiner-Android-${{ github.sha }}
          path: apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "Routiner Android ${TAG_NAME#android-v}" \
              --notes "APK Android de teste do Routiner. O aplicativo conecta ao servidor Routiner configurado no projeto."
          gh release upload "$TAG_NAME" \
            apk/Routiner-Android.apk \
            --clobber
